import com.xpdustry.toxopid.spec.ModMetadata
import com.xpdustry.toxopid.spec.ModPlatform

plugins {
  id "java"
  id "com.xpdustry.toxopid" version "4.2.0"
  id "net.kyori.indra.publishing" version "4.0.0"
}

def metadata = ModMetadata.fromJson(file("mod.hjson"))
group = "com.xpdustry.${metadata.name}"
version = metadata.version
description = metadata.description

// Common settings
subprojects {
  apply plugin: "java"
  apply plugin: "com.xpdustry.toxopid"

  sourceSets.main.java.srcDirs = ["src"]
  sourceSets.main.resources.srcDirs = ["resources"]
  toxopid.compileVersion = "v${metadata.minGameVersion}"
  ext.arcNet = "com.github.Anuken.Arc:arcnet:${toxopid.compileVersion}" //toxopid.dependencies.arcnet

  repositories {
    mavenCentral()
    maven { url "https://maven.xpdustry.com/mindustry" }
    maven { url "https://maven.xpdustry.com/releases" }
    maven { url "https://www.jitpack.io" }
  }

  // Force java 1.8
  compileJava {
    targetCompatibility = JavaVersion.VERSION_1_8
    sourceCompatibility = JavaVersion.VERSION_25
    options.encoding = "UTF-8"
    options.release = 8
    options.compilerArgs += ["-Xlint:-options", "-Xlint:unchecked"]
  }

  // Add desugarizer
  dependencies {
    annotationProcessor "com.xpdustry:jabel:1.1.1"
  }

  // Make fat jar for release
  task release(type: Jar, dependsOn: build) {
    def releaseJar = { ModPlatform.ANDROID in toxopid.platforms.get() ? mergeJar : jar }
    dependsOn releaseJar
    manifest.from releaseJar().manifest
    from {
      zipTree(releaseJar().archiveFile)
    }
    // Add dependencies
    from {
      configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    archiveFileName = "${metadata.name}-${project.name}.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir(name)
  }
}

// Disable toxopid testing tasks
allprojects {
  runMindustryDesktop.enabled = false
  runMindustryServer.enabled = false
}


// Projects configuration
project(":common") {
  dependencies {
    compileOnly toxopid.dependencies.arcCore
    compileOnly arcNet
  }
}

project(":api") {
  dependencies {
    implementation project(":common")
    compileOnly toxopid.dependencies.arcCore
    compileOnly arcNet
  }
}

project(":client") {
  toxopid.platforms = [ModPlatform.DESKTOP, ModPlatform.ANDROID]
  compileJava.options.release = 17 // Mindustry is now using Java 17

  dependencies {
    implementation project(":common")
    implementation project(":api")
    compileOnly toxopid.dependencies.arcCore
    compileOnly toxopid.dependencies.mindustryCore
  }

  // Includes mod json and icon
  processResources.from(rootDir) {
    include "mod.hjson"
    include "icon.png"
  }

  // This is badly made... We need to make a fat jar just for dex compilation,
  // as the property only takes one file as argument
  task mergeDependenciesForDexJar(type: Jar) {
    from sourceSets.main.output
    from {
      configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    destinationDirectory = temporaryDir
  }
  dexJar.source = mergeDependenciesForDexJar.archiveFile

  // Includes android dex
  assemble.dependsOn mergeJar

  // For testing
  runMindustryDesktop.enabled = true
  runMindustryDesktop.mods.from mergeDependenciesForDexJar //meh
  task run(dependsOn: runMindustryDesktop) {} //alias
}

project(":server") {
  ext.mainClassName = "com.xpdustry.claj.server.Main"
  toxopid.platforms = [ModPlatform.SERVER]

  dependencies {
    implementation project(":common")
    implementation toxopid.dependencies.arcCore
    implementation arcNet
    implementation toxopid.dependencies.arcHeadless
  }

  jar {
    manifest.attributes["Main-Class"] = project.mainClassName
    manifest.attributes["Claj-Version"] = metadata.version
    // libclaj, for the stream relay, needs the sockets' descriptors (JDK 9+) and native access (JDK 24+ warns without)
    manifest.attributes["Add-Opens"] = "java.base/sun.nio.ch"
    manifest.attributes["Enable-Native-Access"] = "ALL-UNNAMED"
    //TODO: use arc-lite
    //exclude "arc/graphics/**", "arc/math/geom/**", "arc/net/dns/**", "arc/util/noise/**"
  }

  task run(type: JavaExec, dependsOn: classes) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = temporaryDir
    args 7000 // default port
    jvmArgs "-DClaj-Version=${metadata.version}" // claj version
  }

  // libclaj, the Linux system calls Java lacks, for the stream relay. Built with zig (-Pzig=/path/to/zig) for x86_64
  // and aarch64, glibc and musl, else with gcc for this machine only, else not at all: the relay keeps its Java paths.
  def arch = System.getProperty("os.arch") == "amd64" ? "x86_64" : System.getProperty("os.arch")
  def libc = new File("/lib").listFiles()?.any { it.name.startsWith("ld-musl-") } ? "musl" : "gnu"
  def works = { List<String> command -> try { command.execute().waitFor() == 0 } catch (IOException ignored) { false } }
  def zig = findProperty("zig") ?: ["sh", "-c", "command -v zig || true"].execute().text.trim()
  def targets = zig && works([zig, "version"]) ?
    ["x86_64-gnu": "x86_64-linux-gnu.2.17", "aarch64-gnu": "aarch64-linux-gnu.2.17", "x86_64-musl": "x86_64-linux-musl",
     "aarch64-musl": "aarch64-linux-musl"].collectEntries { k, v -> [k, [zig, "cc", "-target", v]] } :
    System.getProperty("os.name") == "Linux" && works(["gcc", "--version"]) ?
    [("${arch}-${libc}".toString()): ["gcc", "-Wl,-z,noseparate-code"]] : [:]
  def sources = files("native/claj.c", "native/claj_jni.c")
  def outDir = layout.buildDirectory.dir("native")

  task compileNative {
    def jdk = System.getProperty("java.home")
    inputs.files sources, file("native/claj.h")
    inputs.property "targets", targets.collect { k, v -> k + v.join(" ") }
    outputs.dir outDir
    doLast {
      delete outDir
      if (targets.isEmpty()) logger.warn("server: no zig and no gcc, the jar has no libclaj")
      targets.each { target, compiler ->
        def library = outDir.get().file("com/xpdustry/claj/server/stream/linux-${target}/libclaj.so").asFile
        library.parentFile.mkdirs()
        exec {
          commandLine compiler + ["-std=c99", "-Wall", "-Wextra", "-Wno-unused-parameter", "-Werror", "-Os", "-fPIC",
                                  "-shared", "-fvisibility=hidden", "-s", "-I${jdk}/include", "-I${jdk}/include/linux",
                                  "-o", library] + sources.files
        }
      }
    }
  }
  sourceSets.main.output.dir(outDir, builtBy: compileNative)

  // Socket-level checks of the stream relay, with what the manifest gives java -jar. Usage: ./gradlew :server:checkRelay
  // [-PtestJava=/path/to/java8/bin/java] [-Pchecks=name,name] [-Pudp=off|jni, which fails if it isn't the one in use]
  sourceSets.test.java.srcDirs = ["test"]
  compileTestJava {
    options.release = 8
    options.compilerArgs += ["-Xlint:-options"]
  }
  def checks = { JavaExec task, String udp ->
    task.mainClass = "com.xpdustry.claj.server.stream.RelayChecks"
    task.classpath = sourceSets.test.runtimeClasspath
    task.workingDir = task.temporaryDir
    if (findProperty("testJava")) task.executable = findProperty("testJava")
    if (udp) task.systemProperty "checks.udp", udp
    // fd-exhaustion runs the server as a release does, from jars, which stay open when descriptors run out
    task.dependsOn jar
    task.doFirst { task.systemProperty "checks.serverClasspath", (files(jar.archiveFile) + configurations.runtimeClasspath).asPath }
    // JDK 9+ launchers only read JDK_JAVA_OPTIONS, and --enable-native-access exists since 17
    task.doFirst {
      def out = new ByteArrayOutputStream()
      exec { commandLine task.executable ?: task.javaLauncher.get().executablePath, "-version"; errorOutput = out }
      int version = (out.toString() =~ /version "(?:1\.)?(\d+)/)[0][1] as int
      if (version >= 9) task.environment "JDK_JAVA_OPTIONS", "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED" +
                                                              (version >= 17 ? " --enable-native-access=ALL-UNNAMED" : "")
    }
  }
  task checkRelay(type: JavaExec, dependsOn: testClasses) {
    checks(it, findProperty("udp"))
    if (findProperty("checks")) args findProperty("checks").split(",")
  }
  check.dependsOn checkRelay

  // The checks that send datagrams, with Java's UDP then libclaj's. Usage: ./gradlew :server:checkUdpBackends
  def udpChecks = ["hello-udp", "hello-udp-duplicate", "hello-udp-other-address", "udp-control-reply",
                   "udp-control-join", "udp-control-create", "udp-control-list-truncated", "udp-control-pipelined",
                   "udp-control-malformed", "udp-transition-reads-tcp-first", "udp-control-config",
                   "idle-timeout-datagrams", "datagram-udp-host", "datagram-tcp-host", "error-isolation-udp-hello",
                   "datagram-ipv6", "datagram-batch"]
  task checkUdpOff(type: JavaExec, dependsOn: testClasses) { checks(it, "off"); args udpChecks }
  task checkUdpJni(type: JavaExec, dependsOn: testClasses) {
    checks(it, "jni")
    args udpChecks
    onlyIf("libclaj is built for this machine") { !fileTree(outDir).isEmpty() }
  }
  task checkUdpBackends(dependsOn: [checkUdpOff, checkUdpJni])
}

project(":bench") {
  ext.mainClassName = "com.xpdustry.claj.bench.Main"
  toxopid.platforms = [ModPlatform.SERVER]
  compileJava.options.release = 21 // Yea we are modern sometime =)

  dependencies {
    implementation "info.picocli:picocli:4.7.6"
    implementation toxopid.dependencies.arcCore
  }

  jar {
    manifest.attributes["Main-Class"] = project.mainClassName
    manifest.attributes["Implementation-Version"] = metadata.version
  }

  // Only the utilities of Arc are used
  def keptGeom = ["Position", "Vec2", "Vector"].collect { "arc/math/geom/${it}.class".toString() }
  release {
    exclude "arc/graphics/**", "arc/scene/**", "arc/assets/**", "arc/audio/**", "arc/input/**", "arc/mock/**",
            "arc/util/noise/**", "arc/util/viewport/**"
    exclude { it.path.startsWith("arc/math/geom/") && !keptGeom.contains(it.path) }
  }

  // Usage: ./gradlew :bench:run -PbenchArgs="compare --server ..."
  task run(type: JavaExec, dependsOn: classes) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = rootDir
    args = (findProperty("benchArgs") ?: "help").toString().split(" ").toList()
  }
}

// To shut up Javadoc
subprojects {
  javadoc.options {
    addStringOption("Xdoclint:none", "-quiet")
    addStringOption("-enable-preview")
    addStringOption("-release", "25")
  }
}


// Publishing
subprojects {
  apply plugin: "net.kyori.indra.publishing"

  signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
  }

  indra {
    javaVersions {
      target(8)
      minimumToolchain(8)
    }

    gpl3OnlyLicense()
    publishReleasesTo("xpdustry", "https://maven.xpdustry.com/releases")

    def repo = metadata.repository.split("/")
    github(repo[0], repo[1]) {
      ci(true)
      issues(true)
      scm(true)
    }

    configurePublications {
      from components.java
      artifact sourcesJar
      artifact javadocJar
      artifact(release) { classifier = "all" }

      pom {
        organization {
          name = "Xpdustry"
          url = "https://www.xpdustry.com"
        }

        developers {
          metadata.author.split(",").each { author ->
            developer {
              id = author.trim()
              url = "https://github.com/${author.trim()}"
            }
          }
        }
      }
    }
  }

  // I want these to only be included when publishing, not all the time...
  task javadocJar(type: Jar, dependsOn: 'javadoc') {
    from javadoc.destinationDir
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
    archiveClassifier = 'javadoc'
  }
  task sourcesJar(type: Jar, dependsOn: 'classes') {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
  }
}
